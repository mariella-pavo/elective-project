<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Five Educational Learning Theories</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- welcome screen -->
<section id="welcome-screen">
    <h1 class="welcome-title">Five Educational Learning Theories</h1>
    <button class="play-button" id="play-button">Play</button>
</section>

<!-- conversation -->
<section id="interactive-screen">
    <div class="screen-content" id="content">

        <div class="speech speech-top">
            <span class="name" id="speaker1">Pavo</span>
            <p id="question">What are the five learning theories?</p>
        </div>

        <img src="assets/pavo.png" alt="Pavo" class="cat cat-top">

        <div class="speech speech-bottom">
            <span class="name" id="speaker2">Tan</span>
            <p id="answer">idk... let's learn</p>
        </div>

        <img src="assets/tan.png" alt="Tan" class="cat cat-bottom">

        <div class="continue" id="instruction">Tap anywhere to continue</div>
    </div>
</section>

<script>
const slides = [
    {
        question: "What are the five learning theories?",
        answer: "idk... let's learn",
        speaker1: "Pavo",
        speaker2: "Tan"
    },
    {
        question: "First, let's explore Behaviorism.",
        answer: "Learning through experience and reinforcement.",
        speaker1: "Pavo",
        speaker2: "Tan"
    },
    {
        question: "Next up: Cognitivism!",
        answer: "It's all about how we think, remember, and process information.",
        speaker1: "Pavo",
        speaker2: "Tan"
    },
    {
        question: "What about Constructivism?",
        answer: "We build knowledge through our own experiences.",
        speaker1: "Pavo",
        speaker2: "Tan"
    },
    {
        question: "Let's talk about Humanism.",
        answer: "Learning focuses on personal growth and individual potential.",
        speaker1: "Pavo",
        speaker2: "Tan"
    },
    {
        question: "And finally, Connectivism!",
        answer: "Learning through networks, connections, and digital resources.",
        speaker1: "Pavo",
        speaker2: "Tan"
    }
];

const welcomeScreen = document.getElementById("welcome-screen");
const interactiveScreen = document.getElementById("interactive-screen");
const playButton = document.getElementById("play-button");
const content = document.getElementById("content");

let currentSlide = 0;

playButton.addEventListener("click", function () {
    welcomeScreen.style.display = "none";
    interactiveScreen.style.display = "block";
    currentSlide = 0;
    updateSlide();
});

function updateSlide() {
    document.getElementById("question").textContent = slides[currentSlide].question;
    document.getElementById("answer").textContent = slides[currentSlide].answer;
    document.getElementById("speaker1").textContent = slides[currentSlide].speaker1;
    document.getElementById("speaker2").textContent = slides[currentSlide].speaker2;
}

function nextSlide() {
    content.classList.add("fade");

    setTimeout(() => {
        currentSlide = (currentSlide + 1) % slides.length;
        updateSlide();
        content.classList.remove("fade");
    }, 250);
}

interactiveScreen.addEventListener("click", nextSlide);

document.addEventListener("keydown", function (event) {
    if (
        interactiveScreen.style.display === "block" &&
        (event.code === "Space" || event.code === "Enter")
    ) {
        event.preventDefault();
        nextSlide();
    }
});
</script>

</body>
</html>
